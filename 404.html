<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Dane Beels</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0B1A33">
    <link rel="icon" type="image/x-icon" href="/favicon_io/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
          else if (window.matchMedia("(prefers-color-scheme: light)").matches) document.documentElement.setAttribute("data-theme", "light");
        } catch (e) {}
      })();
    </script>
    <!-- absolute paths: GitHub Pages serves this file for any missing URL, at any depth -->
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <main class="notfound">
      <div>
        <h1 class="notfound__code">404</h1>
        <p>That page doesn't exist.</p>
        <a class="btn btn--primary" href="/">Back to home</a>
      </div>
    </main>
  </body>
</html>
